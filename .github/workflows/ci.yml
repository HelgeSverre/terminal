name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_target:
        description: "just recipe to run for an isolated diagnostic"
        required: false
        default: test
        type: choice
        options:
          - test
          - glyph-rendering-tests
          - metal-upload-probe

permissions:
  contents: read

# Fresh hosted runners install current formulae. Skip unrelated Homebrew
# metadata refresh/cleanup; do not cache Cellar paths or dependency dylibs.
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  # Match the local toolchain (Xcode 26.3, Swift 6.2.4); the image default moves ahead.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: macOS · Headless tests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test tools
        run: brew install just fish neovim tmux fzf
      - name: Ensure Metal compiler is available
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Identify test toolchain
        id: toolchain
        run: echo "id=$( { xcrun swift --version; xcodebuild -version; xcrun --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: tests-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Sources/**', 'Tests/**', 'Resources/**', 'Benchmarks/**', 'assets/**', 'tools/**', 'Package.swift', 'Package.resolved', 'justfile') }}
          restore-keys: |
            tests-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-
      - name: Run Swift native tests
        env:
          TERMINAL_CI_GPU_POLICY: paravirtual
          TERMINAL_TEST_SHARDS: "2"
        run: |
          mkdir -p reports
          set -o pipefail
          just "${{ github.event.inputs.test_target || 'test' }}" 2>&1 | tee reports/ci-tests.txt
      - name: Verify the application bundle
        if: ${{ !github.event.inputs.test_target || github.event.inputs.test_target == 'test' || github.event.inputs.test_target == 'glyph-rendering-tests' }}
        run: just _verify-bundle
      - name: Check Swift 6 consumer embedding
        if: ${{ !github.event.inputs.test_target || github.event.inputs.test_target == 'test' }}
        run: just embedding-check
      - name: Build ad-hoc signed WMO release bundle
        if: ${{ !github.event.inputs.test_target || github.event.inputs.test_target == 'test' }}
        run: just release-build
      - name: Collect glyph residency crash report
        if: always()
        run: |
          mkdir -p reports/crash-reports
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -name 'swiftpm-testing-helper*.ips' -o -name 'swiftpm-testing-helper*.crash' -o -name 'xctest*.ips' -o -name 'xctest*.crash' \) -exec cp {} reports/crash-reports/ \;
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-test-results
          path: |
            reports/ci-tests.txt
            reports/crash-reports
            reports/gpu-policy
            reports/test-timing

  conformance:
    name: Terminal protocol conformance
    if: ${{ !github.event.inputs.test_target || github.event.inputs.test_target == 'test' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install just
      - name: Run esctest against the emulator
        run: |
          mkdir -p reports
          set -o pipefail
          just esctest 2>&1 | tee reports/esctest-ci.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-results
          path: |
            reports/esctest.json
            reports/esctest.log
            reports/esctest-ci.txt

  # Preserve the existing required-check name: a passing headless job alone
  # must not hide a failed conformance check.
  macos:
    name: macOS · Swift native tests
    needs: [headless, conformance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected gate
        env:
          HEADLESS_RESULT: ${{ needs.headless.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          TEST_TARGET: ${{ github.event.inputs.test_target || 'test' }}
        run: |
          test "$HEADLESS_RESULT" = success
          if [ "$TEST_TARGET" = test ]; then
            test "$CONFORMANCE_RESULT" = success
          fi
