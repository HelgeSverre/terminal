name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_target:
        description: "just recipe to run for an isolated diagnostic"
        required: false
        default: test
        type: choice
        options:
          - test
          - session-test
          - glyph-rendering-tests
          - metal-upload-probe

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS · Swift native tests
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test tools
        run: brew install just fish neovim tmux fzf
      - name: Ensure Metal compiler is available
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Identify test toolchain
        id: toolchain
        run: echo "id=$( { xcrun swift --version; xcodebuild -version; xcrun --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: tests-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Sources/**', 'Tests/**', 'Resources/**', 'Benchmarks/**', 'assets/**', 'tools/**', 'Package.swift', 'Package.resolved', 'justfile') }}
          restore-keys: |
            tests-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-
      - name: Run Swift native tests
        env:
          TERMINAL_CI_GPU_POLICY: paravirtual
        run: |
          mkdir -p reports
          set -o pipefail
          just "${{ github.event.inputs.test_target || 'test' }}" 2>&1 | tee reports/ci-tests.txt
      - name: Verify the application bundle
        if: ${{ !github.event.inputs.test_target || github.event.inputs.test_target == 'test' || github.event.inputs.test_target == 'glyph-rendering-tests' }}
        run: just _verify-bundle
      - name: Collect glyph residency crash report
        if: always()
        run: |
          mkdir -p reports/crash-reports
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -name 'swiftpm-testing-helper*.ips' -o -name 'swiftpm-testing-helper*.crash' -o -name 'xctest*.ips' -o -name 'xctest*.crash' \) -exec cp {} reports/crash-reports/ \;
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-test-results
          path: |
            reports/ci-tests.txt
            reports/esctest.json
            reports/esctest.log
            reports/fuzz-current-seed
            reports/crash-reports
            reports/gpu-policy
            reports/test-timing

  conformance:
    name: Terminal protocol conformance
    if: ${{ !github.event.inputs.test_target || github.event.inputs.test_target == 'test' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install just
      - name: Run esctest against the emulator
        run: |
          mkdir -p reports
          set -o pipefail
          just esctest 2>&1 | tee reports/esctest-ci.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-results
          path: |
            reports/esctest.json
            reports/esctest.log
            reports/esctest-ci.txt

  fuzz:
    name: Emulator address-sanitizer fuzzing
    if: ${{ !github.event.inputs.test_target || github.event.inputs.test_target == 'test' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install just
      - name: Fuzz the emulator for two minutes
        run: just fuzz 120
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-results
          path: reports/fuzz-current-seed
