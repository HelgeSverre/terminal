name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS · Rust and native tests
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test tools
        run: brew install just fish neovim tmux fzf
      - name: Ensure Metal compiler is available
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Run formatting, Clippy, Rust and native tests
        run: |
          mkdir -p reports
          set -o pipefail
          just test 2>&1 | tee reports/ci-tests.txt
      - name: Verify the application bundle
        run: just verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-test-results
          path: |
            reports/ci-tests.txt
            reports/session-tests.json
