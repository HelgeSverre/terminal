name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

concurrency:
  group: terminal-release
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install test tools
        run: brew install just fish neovim tmux fzf

      - name: Ensure Metal compiler is available
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Identify test toolchain
        id: toolchain
        run: echo "id=$( { xcrun swift --version; xcodebuild -version; xcrun --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: tests-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Sources/**', 'Tests/**', 'Resources/**', 'Benchmarks/**', 'assets/**', 'tools/**', 'Package.swift', 'Package.resolved', 'justfile') }}
          restore-keys: |
            tests-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-

      # Build the complete test graph once, including the metadata validator.
      - name: Build test products
        run: just _test-build

      - name: Validate version and source
        id: metadata
        run: |
          mkdir -p dist/release
          target/swiftpm/testing/debug/dev release-publisher validate --output dist/release/release-metadata.json

      - name: Run tests
        env:
          TERMINAL_CI_GPU_POLICY: paravirtual
          TERMINAL_TEST_SHARDS: "2"
        run: just test

  build:
    name: Build, sign, and notarize
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A fresh runner: no test tools, test artifacts, or test cache.
      - name: Build release tool
        run: |
          mkdir -p target/native
          xcrun swiftc -O "$PWD"/tools/Dev/*.swift -o target/native/dev

      - name: Validate version and source
        id: metadata
        run: |
          mkdir -p dist/release
          target/native/dev release-publisher validate --output dist/release/release-metadata.json

      - name: Ensure Metal compiler is available
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Build release app and distribution tool
        run: |
          target/native/dev bundle release
          xcrun swiftc -parse-as-library tools/Distribution.swift tools/Dev/SigningOrder.swift -o target/native/distribute

      - name: Import release credentials
        env:
          APPLE_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_BASE64 }}
          APPLE_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: target/native/dev release-signing setup >> "$GITHUB_ENV"

      - name: Sign, notarize, and validate app
        env:
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
        run: target/native/distribute release

      - name: Sign the update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: target/native/dev release-publisher appcast --metadata dist/release/release-metadata.json

      - name: Record artifact checksums
        run: target/native/dev release-publisher manifest --metadata dist/release/release-metadata.json

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/release/HelgeTerminal-*-universal.zip
            dist/release/appcast.xml
            dist/release/release-metadata.json
            dist/release/release-manifest.json
            dist/release/SHA256SUMS

      - name: Remove release credentials
        if: always()
        run: target/native/dev release-signing cleanup

  publish:
    name: Publish release and update Homebrew
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.publish == 'true'
    # macOS, because the developer tool that publishes is built with Xcode's Swift.
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-release
          path: dist/release

      # The release commands are part of the developer tool. It is compiled
      # from absolute paths because it locates the repository from them.
      - name: Build release tool
        run: |
          mkdir -p target/native
          xcrun swiftc -O "$PWD"/tools/Dev/*.swift -o target/native/dev

      - name: Publish verified assets and update cask
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: target/native/dev release-publisher publish --metadata dist/release/release-metadata.json
