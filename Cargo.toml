[workspace]
members = ["crates/terminal-core", "crates/terminal-tools"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"

[patch.crates-io]
unicode-segmentation = { path = "vendor/unicode-segmentation" }
